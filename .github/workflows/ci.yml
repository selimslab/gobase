name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it explicitly, so a
# compromised action cannot push, tag, or open a pull request.
permissions:
  contents: read

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The default credential stays in .git/config for the whole job;
          # nothing here needs it.
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Built from source rather than via golangci-lint-action: the action
      # downloads a prebuilt binary, and golangci-lint refuses to run when the
      # Go version it was built with is older than the module's `go` directive.
      # Installing it here compiles it with the toolchain set up above.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: go vet
        run: go vet ./...

      - name: Verify layering
        run: ./scripts/check-layers.sh

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Hardening options compile
        run: |
          go vet -tags hardening ./docs/hardening/...
          go test -tags hardening ./docs/hardening/...

  sec:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks scans the full history on a push, so it needs one.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify module checksums
        run: go mod verify

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Build only: publishing is a release concern, and this workflow has no
      # registry credentials by design.
      - name: Build image
        run: docker build -t gobase:ci .

      - name: Image runs as a non-root user
        run: |
          user=$(docker inspect -f '{{.Config.User}}' gobase:ci)
          echo "image user: ${user}"
          test "${user}" = "nonroot" || test "${user}" = "65532:65532"
