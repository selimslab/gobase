# Release — build, generate an SBOM, and sign the artefacts with cosign.
#
# When you need it: someone other than you consumes your builds and needs to
# verify they came from your pipeline rather than a compromised laptop.
#
# What it costs: nothing in money — keyless signing uses the workflow's OIDC
# identity, so there is no private key to store or rotate. It costs a longer
# release, and consumers must actually run `cosign verify`; an unverified
# signature protects no one.
#
# To adopt: copy to .github/workflows/release.yml. It runs on a tag push.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and sign
    runs-on: ubuntu-latest
    permissions:
      # To attach binaries to the GitHub release.
      contents: write
      # To push the image to GHCR.
      packages: write
      # The keyless-signing identity. Without it, cosign has nothing to sign as.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PKG=github.com/selimslab/gobase/internal/platform/version
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.BuildTime=$BUILD_TIME" \
              -o "dist/server-${os}-${arch}" ./cmd/server
          done

          # Checksums let a consumer verify a binary without cosign.
          (cd dist && sha256sum server-* > SHA256SUMS)

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the checksums and SBOM
        run: |
          set -euo pipefail
          # Keyless: the signature is bound to this workflow's OIDC identity
          # and recorded in the public Rekor transparency log.
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS
          cosign sign-blob --yes \
            --output-signature dist/sbom.spdx.json.sig \
            --output-certificate dist/sbom.spdx.json.pem \
            dist/sbom.spdx.json

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

# Consumers verify with:
#
#   cosign verify-blob \
#     --certificate SHA256SUMS.pem \
#     --signature SHA256SUMS.sig \
#     --certificate-identity-regexp 'https://github.com/selimslab/gobase/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS
#
# Pin --certificate-identity-regexp to your repository. Without it, any
# GitHub workflow's signature verifies, which defeats the purpose.
