# Trivy — vulnerability and misconfiguration scanning for the container image.
#
# When you need it: you ship a container. govulncheck covers Go code; Trivy
# covers everything else in the image and the Dockerfile itself.
#
# What it costs: a few minutes, and a database download per run. Against a
# distroless base there is very little left to find — which is the point of
# using one, and the scan is what proves it stays that way.
#
# To adopt: copy to .github/workflows/trivy.yml.

name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Scan image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t gobase:scan .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gobase:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # Unfixable findings are noise in a gate: there is no action to take.
          ignore-unfixed: true

      - name: Scan the Dockerfile and workflows
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: .
