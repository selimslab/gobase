# CodeQL — static analysis for security bugs.
#
# When you need it: a repository that is public, or one where a second pair of
# eyes on every PR is worth the wait. It finds injection, path traversal, and
# unsafe deserialization that a linter does not.
#
# What it costs: a few minutes per run, and it needs `security-events: write`
# to publish results. Free on public repositories; a paid feature (GitHub
# Advanced Security) on private ones.
#
# To adopt: copy to .github/workflows/codeql.yml.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch newly published rules against code that has not changed.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      # The only extra grant CodeQL needs.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
          # security-extended adds rules with a higher false-positive rate but
          # real findings behind them.
          queries: security-extended

      - name: Build
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:go"
